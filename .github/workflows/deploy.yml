name: Deploy Landing

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'images/**'
      - 'fonts/**'
      - 'videos/**'
      - 'for-physios/**'
      - '!*.md'

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        type: string
        default: production

  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "DEPLOY" to confirm'
        required: true
        type: string

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY" ]; then
            echo "❌ Deployment requires confirmation 'DEPLOY'"
            exit 1
          fi

  deploy:
    name: Deploy to Production
    needs: [validate]
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::855246887543:role/moovv-fit-github-actions-release-role
          aws-region: ap-south-1

      - name: Get CloudFront Distribution ID
        id: cf
        run: |
          DIST_ID=$(aws ssm get-parameter \
            --name "/moovv-fit/production/landing_cloudfront_distribution_id" \
            --query "Parameter.Value" \
            --output text)
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Sync to S3
        run: |
          # Sync all assets with long cache (skip delete on warnings)
          aws s3 sync . s3://moovv-fit-content-production/web/landing/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".agents/*" \
            --exclude ".kiro/*" \
            --exclude "*.md" \
            --exclude ".gitignore" \
            --exclude ".release-please-manifest.json" \
            --exclude "release-please-config.json" \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE || {
              echo "::warning::S3 sync returned non-zero exit code, checking if uploads succeeded"
              # If files were uploaded, consider it a success (delete failures are warnings)
              aws s3 ls s3://moovv-fit-content-production/web/landing/index.html && echo "index.html exists, continuing"
            }

          # HTML files with shorter cache (5 min)
          aws s3 sync . s3://moovv-fit-content-production/web/landing/ \
            --exclude "*" \
            --include "*.html" \
            --include "for-physios/*.html" \
            --include "for-clinics/*.html" \
            --cache-control "public, max-age=300" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cf.outputs.distribution_id }} \
            --paths "/*"

      - name: Summary
        run: |
          echo "## ✅ Landing Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **S3**: s3://moovv-fit-content-production/web/landing/" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: ${{ steps.cf.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://www.moovv.fit" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
